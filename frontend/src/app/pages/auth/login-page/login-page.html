<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="login-logo">
        <mat-icon>photo_camera</mat-icon>
        <h1>FotoPro</h1>
      </div>
      <p class="login-subtitle">Inicia sesión en tu cuenta</p>
    </mat-card-header>

    <mat-card-content>
      @if (error()) {
        <div class="error-banner">
          <mat-icon>error_outline</mat-icon>
          {{ error() }}
        </div>
      }

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Correo electrónico</mat-label>
        <input
          matInput
          type="email"
          placeholder="correo@ejemplo.com"
          [ngModel]="correo()"
          (ngModelChange)="correo.set($event)"
        />
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          [type]="mostrarContrasena() ? 'text' : 'password'"
          [ngModel]="contrasena()"
          (ngModelChange)="contrasena.set($event)"
          (keyup.enter)="login()"
        />
        <button mat-icon-button matSuffix type="button"
          (click)="mostrarContrasena.set(!mostrarContrasena())">
          <mat-icon>{{ mostrarContrasena() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions>
      <button
        mat-flat-button
        class="full-width"
        (click)="login()"
        [disabled]="cargando()"
      >
        @if (cargando()) {
          <mat-spinner diameter="20" />
          Ingresando...
        } @else {
          <mat-icon>login</mat-icon>
          Iniciar sesión
        }
      </button>

      <p class="register-link">
        ¿No tienes cuenta?
        <a routerLink="/register">Regístrate aquí</a>
      </p>
    </mat-card-actions>
  </mat-card>
</div>
