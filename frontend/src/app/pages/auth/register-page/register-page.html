<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="login-logo">
        <mat-icon>photo_camera</mat-icon>
        <h1>FotoPro</h1>
      </div>
      <p class="login-subtitle">Crea tu cuenta como cliente</p>
    </mat-card-header>

    <mat-card-content>
      @if (error()) {
        <div class="error-banner">
          <mat-icon>error_outline</mat-icon>
          {{ error() }}
        </div>
      }

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput [ngModel]="nombre()" (ngModelChange)="nombre.set($event)" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Apellidos</mat-label>
          <input matInput [ngModel]="apellidos()" (ngModelChange)="apellidos.set($event)" />
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" [ngModel]="correo()" (ngModelChange)="correo.set($event)" />
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Teléfono</mat-label>
        <input matInput type="tel" [ngModel]="telefono()" (ngModelChange)="telefono.set($event)" />
        <mat-icon matSuffix>phone</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          [type]="mostrarContrasena() ? 'text' : 'password'"
          [ngModel]="contrasena()"
          (ngModelChange)="contrasena.set($event)"
        />
        <button mat-icon-button matSuffix type="button"
          (click)="mostrarContrasena.set(!mostrarContrasena())">
          <mat-icon>{{ mostrarContrasena() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions>
      <button mat-flat-button class="full-width" (click)="register()" [disabled]="loading()">
        @if (loading()) {
          <mat-spinner diameter="20" />
          Registrando...
        } @else {
          <mat-icon>person_add</mat-icon>
          Crear cuenta
        }
      </button>

      <p class="register-link">
        ¿Ya tienes cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </p>
    </mat-card-actions>
  </mat-card>
</div>
